<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Wajah Mandiri (Ponsel Server & Kamera)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col">

    <header class="bg-slate-800 p-4 shadow-md text-center">
        <h1 class="text-xl font-bold">📱 Absensi Wajah HP Mandiri</h1>
        <p class="text-xs text-slate-400">Ponsel berfungsi sebagai Kamera & Pusat Data Lokal</p>
    </header>

    <main class="flex-1 flex flex-col p-4 max-w-md mx-auto w-full justify-between">
        
        <div class="relative bg-black rounded-xl overflow-hidden shadow-lg aspect-[3/4] flex items-center justify-center">
            <video id="videoElement" autoplay playsinline muted class="w-full h-full object-cover"></video>
            
            <canvas id="snapshotCanvas" class="hidden"></canvas>

            <div class="absolute bottom-4 inset-x-4 bg-black/70 backdrop-blur-md p-3 rounded-lg text-center">
                <p id="statusText" class="text-sm font-semibold text-emerald-400">Memuat Model AI Wajah...</p>
            </div>
        </div>

        <div class="mt-4 space-y-3">
            <input type="text" id="studentNameInput" placeholder="Masukkan Nama Siswa" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-400 focus:outline-none focus:border-emerald-500">
            
            <div class="grid grid-cols-2 gap-2">
                <button onclick="registerStudent()" id="btnRegister" disabled class="bg-slate-700 opacity-50 p-3 rounded-lg font-semibold text-sm transition">
                    Daftar Wajah Baru
                </button>
                <button onclick="startAttendance()" id="btnAttendance" disabled class="bg-slate-700 opacity-50 p-3 rounded-lg font-semibold text-sm transition">
                    Mulai Absensi
                </button>
            </div>

            <button onclick="openAttendanceModal()" class="w-full bg-slate-700 hover:bg-slate-600 p-3 rounded-lg font-semibold text-sm transition">
                📋 Lihat Data Absen Hari Ini
            </button>
        </div>

        <div class="mt-4 bg-slate-800 p-3 rounded-xl">
            <h2 class="text-xs font-bold text-slate-400 uppercase mb-1">Pusat Data Lokal (Database Ponsel):</h2>
            <div id="databaseStats" class="text-xs text-slate-300">Total Siswa Terdaftar: 0 | Absensi Hari Ini: 0</div>
        </div>
    </main>

    <div id="attendanceModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 w-full max-w-md rounded-2xl p-5 flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-lg">Riwayat Absensi Hari Ini</h2>
                <button onclick="closeAttendanceModal()" class="text-slate-400 hover:text-white font-bold text-lg">&times;</button>
            </div>
            
            <div id="attendanceListContainer" class="flex-1 overflow-y-auto space-y-2 pr-1 divide-y divide-slate-700 mb-3">
                </div>

            <div class="space-y-2">
                <button onclick="exportToCSV()" class="w-full bg-emerald-600 hover:bg-emerald-500 p-2.5 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1">
                    📥 Ekspor Data ke Excel (CSV)
                </button>
                <button onclick="clearAttendanceToday()" class="w-full bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-600/50 p-2.5 rounded-lg text-xs font-semibold transition">
                    Reset Absensi Hari Ini
                </button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('snapshotCanvas');
        const statusText = document.getElementById('statusText');
        const studentNameInput = document.getElementById('studentNameInput');
        const dbStats = document.getElementById('databaseStats');
        const btnRegister = document.getElementById('btnRegister');
        const btnAttendance = document.getElementById('btnAttendance');
        const attendanceModal = document.getElementById('attendanceModal');
        const attendanceListContainer = document.getElementById('attendanceListContainer');

        let studentDatabase = JSON.parse(localStorage.getItem('students')) || {};
        let attendanceLog = JSON.parse(localStorage.getItem('attendance')) || {};
        let isModelReady = false;

        updateStats();

        // 1. Memuat Model AI Face-API saat aplikasi dibuka
        async function loadModels() {
            try {
                statusText.innerText = "Memuat model AI wajah (harap tunggu)...";
                // Menggunakan model dari CDN publik
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
                
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmarkTinyNet.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

                isModelReady = true;
                statusText.innerText = "Model AI Siap! Mengaktifkan kamera...";
                initCamera();
            } catch (error) {
                statusText.innerText = "Gagal memuat model AI: " + error.message;
                statusText.classList.add('text-rose-400');
            }
        }

        // 2. Mengaktifkan Kamera Ponsel
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    statusText.innerText = "Kamera Siap. Silakan daftarkan atau absen.";
                    btnRegister.disabled = false;
                    btnRegister.classList.remove('bg-slate-700', 'opacity-50');
                    btnRegister.classList.add('bg-blue-600', 'hover:bg-blue-500');

                    btnAttendance.disabled = false;
                    btnAttendance.classList.remove('bg-slate-700', 'opacity-50');
                    btnAttendance.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
                };
            } catch (error) {
                statusText.innerText = "Gagal mengakses kamera: " + error.message;
                statusText.classList.add('text-rose-400');
            }
        }

        // 3. Mendaftarkan Wajah Siswa Nyata
        async function registerStudent() {
            if (!isModelReady) return alert("Model AI belum siap!");
            const name = studentNameInput.value.trim();
            if (!name) return alert("Harap masukkan nama siswa terlebih dahulu!");

            statusText.innerText = "Mendeteksi wajah untuk pendaftaran...";

            // Deteksi wajah tunggal dari video kamera saat ini beserta vektor fiturnya
            const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks(true).withFaceDescriptor();

            if (!detection) {
                statusText.innerText = "Wajah tidak terdeteksi! Posisikan wajah di depan kamera.";
                alert("Wajah tidak tertangkap dengan jelas. Coba posisikan ulang.");
                return;
            }

            // Simpan vektor wajah (Float32Array dikonversi ke Array biasa agar bisa disimpan di localStorage)
            studentDatabase[name] = {
                descriptor: Array.from(detection.descriptor),
                registeredAt: new Date().toISOString()
            };

            localStorage.setItem('students', JSON.stringify(studentDatabase));
            statusText.innerText = `Berhasil mendaftarkan wajah: ${name}`;
            studentNameInput.value = "";
            updateStats();
        }

        // Fungsi Ambil Foto Snapshot
        function captureSnapshot() {
            canvas.width = video.videoWidth || 300;
            canvas.height = video.videoHeight || 400;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.7);
        }

        // 4. Memulai Pemindaian Absensi Berbasis Pencocokan Wajah Nyata
        async function startAttendance() {
            if (!isModelReady) return alert("Model AI belum siap!");
            const keys = Object.keys(studentDatabase);
            if (keys.length === 0) return alert("Belum ada data siswa terdaftar!");

            statusText.innerText = "Memindai dan mencocokkan wajah...";

            // Deteksi wajah di depan kamera secara real-time
            const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks(true).withFaceDescriptor();

            if (!detection) {
                statusText.innerText = "Wajah tidak ditemukan di depan kamera!";
                return;
            }

            // Siapkan database pembanding dari localStorage
            const labeledDescriptors = keys.map(name => {
                return new faceapi.LabeledFaceDescriptors(
                    name, 
                    [new Float32Array(studentDatabase[name].descriptor)]
                );
            });

            // Buat matcher dengan ambang batas (threshold) kemiripan 0.6 (semakin kecil semakin ketat)
            const faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
            const bestMatch = faceMatcher.findBestMatch(detection.descriptor);

            if (bestMatch.label === 'unknown') {
                statusText.innerText = "Wajah tidak dikenali dalam database!";
            } else {
                const matchedName = bestMatch.label;
                const today = new Date().toISOString().slice(0, 10);
                const attendanceKey = `${today}_${matchedName}`;

                if (attendanceLog[attendanceKey]) {
                    statusText.innerText = `${matchedName} sudah absen hari ini!`;
                } else {
                    const photoSnapshot = captureSnapshot();
                    attendanceLog[attendanceKey] = {
                        name: matchedName,
                        time: new Date().toLocaleTimeString(),
                        photo: photoSnapshot
                    };
                    localStorage.setItem('attendance', JSON.stringify(attendanceLog));
                    statusText.innerText = `Absen Berhasil: ${matchedName}!`;
                    updateStats();
                }
            }
        }

        function updateStats() {
            const totalStudents = Object.keys(studentDatabase).length;
            const today = new Date().toISOString().slice(0, 10);
            const totalAttendance = Object.keys(attendanceLog).filter(k => k.startsWith(today)).length;
            dbStats.innerText = `Total Siswa Terdaftar: ${totalStudents} | Absensi Hari Ini: ${totalAttendance}`;
        }

        function openAttendanceModal() {
            attendanceListContainer.innerHTML = '';
            const today = new Date().toISOString().slice(0, 10);
            const todayRecords = Object.keys(attendanceLog)
                .filter(k => k.startsWith(today))
                .map(k => attendanceLog[k]);

            if (todayRecords.length === 0) {
                attendanceListContainer.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Belum ada data absensi untuk hari ini.</p>';
            } else {
                todayRecords.forEach(record => {
                    const item = document.createElement('div');
                    item.className = 'flex justify-between items-center py-2 text-sm';
                    item.innerHTML = `
                        <div class="flex items-center gap-3">
                            <img src="${record.photo}" class="w-10 h-10 rounded-full object-cover border border-slate-600" alt="Foto">
                            <div>
                                <p class="font-medium text-white">${record.name}</p>
                                <p class="text-[10px] text-emerald-400">${record.time}</p>
                            </div>
                        </div>
                        <span class="text-xs bg-emerald-950/50 text-emerald-400 px-2 py-1 rounded">Hadir</span>
                    `;
                    attendanceListContainer.appendChild(item);
                });
            }
            attendanceModal.classList.remove('hidden');
        }

        function closeAttendanceModal() {
            attendanceModal.classList.add('hidden');
        }

        function exportToCSV() {
            const today = new Date().toISOString().slice(0, 10);
            const todayRecords = Object.keys(attendanceLog)
                .filter(k => k.startsWith(today))
                .map(k => attendanceLog[k]);

            if (todayRecords.length === 0) return alert("Tidak ada data absensi untuk diekspor hari ini!");

            let csvContent = "data:text/csv;charset=utf-8,No,Nama Siswa,Jam Kehadiran,Status\n";
            todayRecords.forEach((record, index) => {
                csvContent += `${index + 1},"${record.name}","${record.time}","Hadir"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Absensi_${today}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function clearAttendanceToday() {
            if (confirm("Yakin ingin mereset data absensi hari ini?")) {
                const today = new Date().toISOString().slice(0, 10);
                Object.keys(attendanceLog).forEach(k => {
                    if (k.startsWith(today)) delete attendanceLog[k];
                });
                localStorage.setItem('attendance', JSON.stringify(attendanceLog));
                updateStats();
                openAttendanceModal();
            }
        }

        // Jalankan pemuatan model saat halaman pertama kali dimuat
        window.addEventListener('load', loadModels);
    </script>
</body>
    </html>
